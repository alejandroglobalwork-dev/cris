<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Feliz cumpleaños</title>
  <meta name="description" content="Un regalo hecho a mano, en digital." />
  <meta name="theme-color" content="#FFF6F0" />

  <meta property="og:title" content="Feliz cumpleaños ✨" />
  <meta property="og:description" content="Escanea, abre y descubre." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- Fondo aura -->
  <div class="aura" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
    <span class="grain"></span>
  </div>

  <!-- Confeti -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Botón de música -->
  <button id="music-toggle" class="music-toggle" hidden aria-pressed="false" title="Música">
    <span class="music-toggle__icon">♪</span>
  </button>

  <main>

    <!-- ============ 1. PORTADA ============ -->
    <section class="screen screen--intro" id="intro">
      <div class="intro__inner">
        <p class="eyebrow reveal">Un regalo para ti</p>
        <h1 class="display reveal" id="intro-name">…</h1>
        <p class="lede reveal" id="intro-phrase"></p>
        <button class="btn btn--primary reveal" id="start-btn">
          <span>Abrir mi regalo</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="hint reveal" id="intro-date"></p>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </section>

    <!-- ============ 2. VÍDEO ============ -->
    <section class="screen section" id="video">
      <header class="section__head reveal">
        <p class="eyebrow">Primero</p>
        <h2 class="h2" id="video-title"></h2>
        <p class="muted" id="video-subtitle"></p>
      </header>
      <div class="video-frame reveal" id="video-frame"></div>
      <button class="btn btn--ghost reveal" id="to-gifts">Continuar a los regalos</button>
    </section>

    <!-- ============ 3. REGALOS ============ -->
    <section class="screen section" id="gifts">
      <header class="section__head reveal">
        <p class="eyebrow">Ahora sí</p>
        <h2 class="h2">Tres regalos, tres retos</h2>
        <p class="muted">Supera cada uno para descubrir qué hay dentro. Léete bien las normas antes de empezar.</p>
      </header>

      <aside class="warning reveal" id="warning" hidden>
        <span class="warning__mark" aria-hidden="true">!</span>
        <div>
          <p class="warning__label" id="warning-label"></p>
          <p class="warning__title" id="warning-title"></p>
          <p class="warning__text" id="warning-text"></p>
        </div>
      </aside>

      <div class="progress reveal" role="status" aria-live="polite">
        <div class="progress__track"><div class="progress__fill" id="progress-fill"></div></div>
        <span class="progress__label" id="progress-label">0 de 3 desbloqueados</span>
      </div>

      <div class="cards" id="cards"></div>

      <button class="btn btn--primary" id="finale-btn" hidden>Ver la última sorpresa</button>
    </section>

    <!-- ============ 4. FINAL ============ -->
    <section class="screen section section--finale" id="finale" hidden>
      <div class="letter reveal">
        <p class="eyebrow" id="letter-eyebrow"></p>
        <h2 class="display display--sm" id="letter-title"></h2>
        <div id="letter-body"></div>
        <p class="signature" id="letter-sign"></p>
      </div>
      <button class="btn btn--quiet" id="replay-btn">Volver a empezar</button>
    </section>

  </main>

  <!-- ============ MODAL DE JUEGOS ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-close aria-label="Cerrar">×</button>
      <p class="eyebrow" id="modal-eyebrow"></p>
      <h3 class="h3" id="modal-title"></h3>
      <p class="muted" id="modal-hint"></p>
      <div class="modal__stage" id="modal-stage"></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/confetti.js"></script>
  <script src="assets/js/games.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
